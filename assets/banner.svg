<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Võ Tiến Khoa — Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="45%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="180" cy="80" r="180" fill="url(#orb1)"/>
  <circle cx="1020" cy="280" r="220" fill="url(#orb2)"/>
  <rect x="0" y="178" width="1200" height="2" fill="url(#glow)"/>

  <!-- Accent bars -->
  <rect x="72" y="112" width="6" height="136" rx="3" fill="#22d3ee"/>
  <rect x="86" y="112" width="2" height="136" rx="1" fill="#818cf8" opacity="0.7"/>

  <text x="110" y="150" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#67e8f9">
    FULLSTACK DEVELOPER
  </text>
  <text x="110" y="210" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#title)">
    Võ Tiến Khoa
  </text>
  <text x="110" y="250" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="18" fill="#94a3b8">
    React · Next.js · Node.js · TypeScript · AWS
  </text>
  <text x="110" y="286" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" fill="#64748b">
    Building polished web products from HCMC, Vietnam  ·  github.com/tkhoaaa
  </text>

  <!-- Decorative code chip -->
  <rect x="900" y="120" width="220" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="922" cy="142" r="5" fill="#f87171"/>
  <circle cx="940" cy="142" r="5" fill="#fbbf24"/>
  <circle cx="958" cy="142" r="5" fill="#34d399"/>
  <text x="920" y="178" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#67e8f9">&lt;code /&gt;</text>
  <text x="920" y="202" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#94a3b8">ship · learn · iterate</text>
  <text x="920" y="224" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#64748b">2022 — present</text>
</svg>
