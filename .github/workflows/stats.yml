name: GitHub Stats SVG

on:
  schedule:
    - cron: "0 0 * * *"          # daily @ 00:00 UTC
  workflow_dispatch:              # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "stats/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write                 # allow committing the generated SVGs

concurrency:
  group: stats-svg
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r stats/requirements.txt

      - name: Render stat SVGs
        env:
          # Optional classic PAT (read:user, repo) improves accuracy for LOC/commits.
          # Falls back to the auto-provided GITHUB_TOKEN when the secret is absent.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_USER: tkhoaaa
        run: python stats/generate_stats.py

      - name: Commit updated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dark_mode.svg output/light_mode.svg
          git diff --staged --quiet || git commit -m "chore(stats): refresh SVGs [skip ci]"
          git push
