name: Update Projects Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch and Update Repos
        run: |
          echo "Automated script to fetch repository stats (stars, forks, releases) from GitHub API and update README goes here."
          
      - name: Create or update portfolio dashboard
        run: |
          echo "Process workflow for extracting telemetry from AWS, WakaTime, Spotify, metrics..."
          # Generates output to assets/dashboard.svg

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update project cards and dashboard stats"
