name: Update profile card

on:
  schedule:
    - cron: "0 3 * * *"           # daily at 03:00 UTC
  workflow_dispatch:               # manual run button
  push:
    branches: [main]
    paths:                         # only when the card's inputs change
      - config.yaml
      - templates/**
      - assets/braille_art*.txt
      - scripts/generate.py
      - .github/workflows/update.yml

permissions:
  contents: write                  # commit the regenerated SVGs

concurrency:
  group: update-profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dark_mode.svg + light_mode.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # GraphQL + REST stats
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          [ -f loc_cache.json ] && git add loc_cache.json || true
          git diff --staged --quiet || git commit -m "chore: refresh profile card [skip ci]"
          git push
